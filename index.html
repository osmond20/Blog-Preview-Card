<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <!--Favicon-->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <!--StyleSheet-->
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>
  <header class="header_container">

  </header>

  <!--Main content-->
  <main>
    <article class="card">
      <img class="img" src="assets/images/illustration-article.svg" alt="Image of Blog Preview Card">

      <article class="info">
        <span class="subinfo">Learning</span>
        <p class="publication">Published 21 Dec 2023</p>
      </article>

      <article class="title_and_content">
        <p class="title">HTML & CSS foundations</p>
        <p class="content">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </article>

      <article class="publisher">
        <img class="profile_pic" src="assets/images/image-avatar.webp" alt="Profile pic of publisher">
        <span class="publisher_name">Greg Hooper</span>
      </article>

    </article>
  </main>
  
  <!--Footer content-->
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">osmond20</a>.
  </footer>
</body>
</html>
